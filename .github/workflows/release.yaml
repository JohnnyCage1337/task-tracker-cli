# Name and Trigger
# Name of the process seen at Action tab
name: Build and Release CLI

# Determine when this process has to activate
on:
  # Condition for start process: when push new tag starting with 'v'
  push:
    tags:
      - 'v*'

# What to do?
jobs:
  #name of thw task: build app for linux system
  build-linux:
    # On what type of os github has to run vm
    runs-on: ubuntu-latest
    # Default: Permissions for read/write github repository. Need write to add release program
    permissions:
      contents: write

    # Commands to do
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # If any test fail, building release stop
    - name: Run Unit Tests
      run: |
        python test_task.py
        python test_task_manager.py

    - name: Install PyInstaller
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller


    - name: Build Single Binary with PyInstaller
      run: |
        pyinstaller --onefile --name task-cli task_cli.py

    - name: Test Executable
      run: |
        .dist/task-cli list || true

    - name: Create Github Release and Upload Asset
      uses: softprops/action-gh-release@v2
      with:
        files: dist/task-cli
        env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
